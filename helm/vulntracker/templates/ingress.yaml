apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.resourceName }}-ingress
  namespace: {{ .Release.Namespace }}
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tlsSecret }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.resourceName }}-service
                port:
                  number: {{ .Values.service.port }}