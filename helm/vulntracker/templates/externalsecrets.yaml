apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secret.externalSecretName }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.secret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secret.secretStoreName }}
    kind: SecretStore
  target:
    name: {{ .Values.secret.kubernetesSecretName }}
  data:
    - secretKey: {{ .Values.secret.kubernetesSecretKey }}
      remoteRef:
        key: {{ .Values.secret.secretManagerSecret }}
