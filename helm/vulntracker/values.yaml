
resourceName: vulntracker

gcp:
  projectID: virtual-limiter-237820
  clusterLocation: asia-south1
  clusterName: test-gke-cluster
  serviceAccountName: gcp-secret-manager-sa

secret:
  enabled: true
  secretStoreName: gcp-secret-store
  externalSecretName: vulntracker-secrets
  refreshInterval: 1h
  kubernetesSecretName: vulntracker-secrets
  kubernetesSecretKey: SECRET_KEY
  secretManagerSecret: vulntracker-secret-key

image:
  repository: asia-south1-docker.pkg.dev/my-gcp-project/vulntracker/vulntracker
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: 8000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

runAsUser: 10001
runAsGroup: 10001

networkPolicy:
  ingressNamespace: ingress-nginx